# Al subir una etiqueta vX.Y.Z crea la release con el zip que descarga WowUp.
# El sufijo -forever del zip es lo que WowUp usa para elegirlo en WoW Forever.
name: Publicar addon

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version: *//p' addon/PitiGolds/PitiGolds.toc | tr -d '\r')
          core=$(sed -n 's/^ns\.VERSION = "\(.*\)".*/\1/p' addon/PitiGolds/Core.lua | tr -d '\r')
          if [ "$toc" != "$version" ] || [ "$core" != "$version" ]; then
            echo "::error::La etiqueta es $version, pero el TOC dice '$toc' y Core.lua dice '$core'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # git archive solo mete lo que está en git: Generated.lua no entra.
      - name: Crear el zip
        run: git archive --format=zip --prefix=PitiGolds/ -o "PitiGolds-$VERSION-forever.zip" HEAD:addon/PitiGolds

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "PitiGolds-$VERSION-forever.zip" --title "PitiGolds $VERSION" --generate-notes
